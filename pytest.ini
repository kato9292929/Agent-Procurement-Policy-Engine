[pytest]
pythonpath = src tests
testpaths = tests
markers =
    live: calls the real Jev API; skipped unless TYPESAFE_API_KEY is set
    postgres: needs a database; skipped unless SPEND_GUARD_TEST_DATABASE_URL is set
# Live tests cost money and need a key, so they never run in the default suite.
addopts = -m "not live"
