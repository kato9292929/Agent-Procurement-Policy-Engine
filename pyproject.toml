[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spend-guard"
version = "0.1.0"
description = "x402 Spend Guard - shadow-mode purchase policy engine"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["x402", "agent", "procurement", "policy", "jev", "shadow-mode"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
# The runtime is dependency-free on purpose: a guard that sits next to a
# payment path must not be able to break it by pulling in a conflicting package.
dependencies = []

[project.optional-dependencies]
# The Postgres ledger backend. `psycopg` is imported inside
# PostgresLedgerBackend, never at package import time, so a JSONL-only
# install stays dependency-free.
postgres = ["psycopg[binary]>=3.1"]
dev = ["jsonschema>=4", "pytest>=8", "psycopg[binary]>=3.1"]

[project.scripts]
guard = "spend_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
